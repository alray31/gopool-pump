[pytest]
# "auto": every `async def test_...` is automatically treated as an
# asyncio test, no per-function @pytest.mark.asyncio decorator needed.
# Without this, pytest-asyncio defaults to "strict" mode (confirmed by a
# real CI run: every async test in tests/test_reauth.py failed at setup
# with "requested an async fixture 'hass', with no plugin or hook that
# handled it") -- this is the standard config used across the HA custom
# integration ecosystem (e.g. the official integration_blueprint
# template) for exactly this reason.
#
# Has no effect on tests/test_logic.py's plain synchronous tests.
asyncio_mode = auto
